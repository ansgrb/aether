[env]
PYO3_PYTHON = { value = ".venv/bin/python", relative = true }
PYO3_USE_ABI3_FORWARD_COMPATIBILITY = "1"

[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-L", "/home/linuxbrew/.linuxbrew/opt/python@3.14/lib",
    "-C", "link-arg=-Wl,-rpath,/home/linuxbrew/.linuxbrew/opt/python@3.14/lib",
]

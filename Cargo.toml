[package]
name = "aether"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Anas Ghareib <https://github.com/ansgrb>"]
description = "Aether (Project BLACKBIRD): Rust-Native Multi-Kernel Notebook & Cyber-Security Mission Cockpit"
repository = "https://github.com/ansgrb/aether"

[lib]
name = "aether"
path = "src/lib.rs"

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
# 1. Async Engine & Concurrency Lifecycle
tokio = { version = "1.38", features = ["full", "process", "sync"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"

# 2. Native Graphics & High-Density Immediate-Mode UI Layer
egui = "0.27"
eframe = { version = "0.27", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }

# 3. Multi-Kernel IPC, Hashing & Stream Utilities
bytes = "1.6"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 4. Reverse Engineering & Binary Introspection (Pure Rust)
goblin = "0.8"
object = "0.32"
capstone = "0.11"

# 5. Real-Time Telemetry Subsystem
sysinfo = "0.30"
